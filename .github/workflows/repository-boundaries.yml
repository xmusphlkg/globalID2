name: Repository Boundaries

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-boundaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-boundaries:
    name: Generated data is untracked
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify repository boundaries and pull request history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/check_repository_boundaries.sh --revision-range "${BASE_SHA}..HEAD"
