[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
norecursedirs = ["deprecated"]
markers = [
    "slow: marks tests that make many network calls and run for several minutes (run with -m slow)",
    "network: marks tests that call live external services (run with --run-network)",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["deprecated", "migrations", "venv", "astro-site", "dashboard/web"]

[tool.ruff.lint]
select = [
    "F821",
    "F811",
    "E722",
    "B023",
    "B033",
    "ASYNC230",
    "PLE2515",
    "PLR0124",
    "RUF024",
    "DTZ003",
    "F402",
    "G201",
    "FURB168",
    "B010",
    "RUF010",
    "UP041",
    "F841",
    "F541",
    "C401",
    "SIM114",
    "UP012",
    "PIE810",
    "FURB188",
    "PIE790",
    "FURB192",
    "SIM113",
    "UP034",
    "UP033",
    "PERF402",
]

[tool.ruff.lint.per-file-ignores]
"tests/unit/test_*.py" = ["F811"]
