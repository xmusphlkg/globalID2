  <style>
    .gids-loading__layer-outer,
    .gids-loading__layer-mid,
    .gids-loading__layer-inner,
    .gids-loading__core {
      transform-box: view-box;
      transform-origin: 120px 120px;
    }
    .gids-loading__layer-outer { animation: gids-loader-spin-cw 14s linear infinite; }
    .gids-loading__layer-mid { animation: gids-loader-spin-ccw 9.5s ease-in-out infinite; }
    .gids-loading__layer-inner { animation: gids-loader-spin-cw 7s linear infinite; }
    .gids-loading__core { animation: gids-loader-core 2.8s ease-in-out infinite; }
    @keyframes gids-loader-spin-cw { to { transform: rotate(360deg); } }
    @keyframes gids-loader-spin-ccw {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(-180deg) scale(0.96); }
    }
    @keyframes gids-loader-core {
      0%, 100% { transform: scale(0.93) rotate(10deg); }
      50% { transform: scale(1.06) rotate(-10deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .gids-loading__layer-outer,
      .gids-loading__layer-mid,
      .gids-loading__layer-inner,
      .gids-loading__core { animation: none; }
    }
  </style>
