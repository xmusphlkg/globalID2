services:
  postgres:
    image: timescale/timescaledb-ha:pg15-latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: globalid
      POSTGRES_USER: globalid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-globalid_dev_password}
    ports:
      - "${GLOBALID_POSTGRES_BIND_ADDRESS:-0.0.0.0}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globalid"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - globalid-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${GLOBALID_REDIS_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - globalid-network

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${GLOBALID_QDRANT_BIND_ADDRESS:-127.0.0.1}:6333:6333"
      - "${GLOBALID_QDRANT_BIND_ADDRESS:-127.0.0.1}:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    networks:
      - globalid-network

volumes:
  postgres_data:
    name: globalid_postgres_data
    driver: local
  redis_data:
    name: globalid_redis_data
    driver: local
  qdrant_data:
    name: globalid_qdrant_data
    driver: local

networks:
  globalid-network:
    driver: bridge
