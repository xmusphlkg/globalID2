services:
  postgres:
    image: timescale/timescaledb-ha:pg15-latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: globalid
      POSTGRES_USER: globalid
      POSTGRES_PASSWORD: globalid_dev_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globalid"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - globalid-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - globalid-network

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - globalid-network

  api:
    image: python:3.12-slim
    working_dir: /app
    command: >
      bash -lc "
      pip install --no-cache-dir -r requirements.txt &&
      uvicorn dashboard.api.main:app --host 0.0.0.0 --port 8000
      "
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://globalid:globalid_dev_password@postgres:5432/globalid
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../:/app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - globalid-network

  dashboard:
    image: node:22-alpine
    working_dir: /app/dashboard
    command: >
      sh -lc "
      npm ci --legacy-peer-deps &&
      npm run dev -- --hostname 0.0.0.0 --port 3000
      "
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:${API_PORT:-8000}/api/v1
    volumes:
      - ../:/app
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - globalid-network

volumes:
  postgres_data:
    name: globalid_postgres_data
  redis_data:
    name: globalid_redis_data
  qdrant_data:
    name: globalid_qdrant_data

networks:
  globalid-network:
    driver: bridge
